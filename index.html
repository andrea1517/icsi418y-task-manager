<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> The Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="input-section">
        <form id="task-form">
            <h2>Task Manager</h2>
            <div id="task-info">
                <label for="task-input">Task:</label>
                <input id="task-input" placeholder="Enter a new task..." type="text">
            </div>

            <div id="priority-input">
                <span>Priority:</span>
                <input type="radio" id="low" value="Low" name="priority">
                <label for="low">Low</label>
                <input type="radio" id="medium" value="Medium" name="priority">
                <label for="medium">Medium</label>
                <input type="radio" id="high" value="High" name="priority">
                <label for="high">High</label>
            </div>

            <button type="submit">Add Task</button>
            <hr>

            <p id="error-message"></p>

            <ul id="task-list"></ul>
        </form>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
